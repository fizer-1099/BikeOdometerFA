name: ساخت APK اندروید
on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: دریافت پروژه
        uses: actions/checkout@v4
      - name: نصب جاوا
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: آماده‌سازی Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: ساخت APK دیباگ
        run: gradle assembleDebug
      - name: انتشار فایل نصب دیباگ
        uses: actions/upload-artifact@v4
        with:
          name: BikeOdometerFA-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: آماده‌سازی کلید امضا
        id: keys
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "has_keys=true" >> "$GITHUB_OUTPUT"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "کلید امضا تنظیم نشده؛ ساخت Release رد می‌شود."
          fi
      - name: ساخت Release امضاشده (APK و AAB)
        if: steps.keys.outputs.has_keys == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease
      - name: انتشار APK نسخه‌ی Release
        if: steps.keys.outputs.has_keys == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fizer-release-apk
          path: app/build/outputs/apk/release/app-release.apk
      - name: انتشار AAB برای گوگل پلی
        if: steps.keys.outputs.has_keys == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fizer-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
